services:
  # 1. Tu aplicación PHP/HTML
  web:
    build: .
    container_name: prohabil_web
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      - bd

  # 2. Tu Base de Datos
  bd:
    image: mariadb:latest
    container_name: prohabil_bd
    environment:
      MYSQL_ROOT_PASSWORD: db_password
      MYSQL_DATABASE: prohabil_db
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      # Construcción de la base de datos automáticamente al arrancar.
      - ./sql/prohabil.sql:/docker-entrypoint-initdb.d/prohabil.sql

volumes:
  mariadb_data: